[project]
name = "jungle-pathing"
version = "0.1.0"
description = "Plan a jungler's opening route on a MOBA map, and choose it against the enemy jungler."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "scipy>=1.11",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jungle_pathing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
